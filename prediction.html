<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Alg/assets/index.css" />
    <link rel="stylesheet" href="../src/index.css" />
    <link rel="stylesheet" href="https://use.typekit.net/jha8zkp.css">
    <title>Document</title>
</head>
<body>
    <header class="exitheader">
        <button class="exitfinal" onclick="goHome()">
            <img src="assets/img/ExitAlg.svg" alt="Exit">
        </button>
    </header>
    <div>
        <h2 class="yourFortune">Your Fortune</h2>
    </div>
    <div class="intro">
        <p class="predictiontext" id="predictionText">"Reading your future..."</p>
    </div>

    <script>
        const API =
            window.location.hostname === "localhost"
                ? "http://localhost:8000"
                : "https://alg-backend.onrender.com";

        const synth = window.speechSynthesis;
        const userId = sessionStorage.getItem("user_id") || "stranger";

        let voices = [];
        let hasStarted = false;
        let speechStopped = false;
        let isLeaving = false;

        function loadVoices() {
            voices = synth.getVoices();
        }

        function getPreferredVoice() {
            if (!voices.length) return null;

            return (
                voices.find(v => v.name === "Google UK English Female") ||
                voices.find(v => v.name === "Microsoft Sonia Online (Natural) - English (United Kingdom)") ||
                voices.find(v => v.name === "Samantha") ||
                voices.find(v => v.name === "Karen") ||
                voices.find(v => v.name.toLowerCase().includes("female") && v.lang.startsWith("en")) ||
                voices.find(v => v.lang === "en-GB") ||
                voices.find(v => v.lang === "en-US") ||
                voices[0]
            );
        }

        function stopSpeaking() {
            speechStopped = true;
            if ("speechSynthesis" in window) {
                synth.cancel();
            }
        }

        function speakLines(lines, index = 0) {
            if (speechStopped) return;
            if (index >= lines.length) return;

            const utterance = new SpeechSynthesisUtterance(lines[index]);
            const selectedVoice = getPreferredVoice();

            if (selectedVoice) {
                utterance.voice = selectedVoice;
                utterance.lang = selectedVoice.lang;
            } else {
                utterance.lang = "en-GB";
            }

            utterance.rate = 0.78;
            utterance.pitch = 0.82;
            utterance.volume = 1;

            utterance.onend = () => {
                if (speechStopped) return;
                setTimeout(() => speakLines(lines, index + 1), 350);
            };

            synth.speak(utterance);
        }

        function speakPrediction() {
            if (!("speechSynthesis" in window)) return;
            if (speechStopped) return;

            synth.cancel();

            const predictionText = document.getElementById("predictionText").textContent.trim();

            const lines = [
                predictionText
            ];

            speakLines(lines);
        }

        async function loadFortune() {
            try {
                const res = await fetch(`${API}/fortune/${encodeURIComponent(userId)}`);
                const data = await res.json();

                document.getElementById("predictionText").textContent =
                    data.fortune || "Your future is still taking shape.";

                if (!hasStarted) {
                    hasStarted = true;
                    setTimeout(() => {
                        if (!speechStopped && !isLeaving) {
                            speakPrediction();
                        }
                    }, 900);
                }
            } catch (err) {
                console.error("Failed to load fortune:", err);
                document.getElementById("predictionText").textContent =
                    "The future is clouded for now, but clarity will return soon.";
            }
        }

        async function goHome() {
            if (isLeaving) return;
            isLeaving = true;

            stopSpeaking();

            try {
                await fetch(`${API}/reset`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ user_id: userId })
                });
            } catch (err) {
                console.error("Reset failed:", err);
            }

            sessionStorage.removeItem("user_id");
            window.location.href = "Home.html";
        }

        if ("speechSynthesis" in window) {
            loadVoices();

            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = loadVoices;
            }
        }

        window.addEventListener("load", () => {
            loadFortune();
        });

        window.addEventListener("beforeunload", () => {
            stopSpeaking();
        });

        window.addEventListener("pagehide", () => {
            stopSpeaking();
        });
    </script>
</body>
</html>
