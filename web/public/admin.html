<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Admin Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      line-height: 1.4;
    }

    h1, h2, h3 {
      margin-bottom: 12px;
    }

    .section {
      margin-bottom: 32px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 12px;
    }

    th, td {
      border: 1px solid #999;
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f2f2f2;
    }

    .small {
      color: #555;
      font-size: 14px;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    .loading {
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Live Admin Dashboard</h1>
  <p class="small">Backend: <span id="apiBase"></span></p>
  <p class="small">Auto-refresh: every 2 seconds</p>

  <div class="section">
    <h2>Current Active User</h2>
    <div id="currentUserStatus" class="loading">Loading current user...</div>

    <table id="currentUserTable">
      <thead>
        <tr>
          <th>Active User</th>
          <th>Has Vector</th>
          <th>Total Seen</th>
          <th>Liked Count</th>
          <th>Skipped Count</th>
          <th>Last Activity</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section">
    <h3>Liked Items</h3>
    <table id="likedTable">
      <thead>
        <tr>
          <th>Item ID</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section">
    <h3>Skipped Items</h3>
    <table id="skippedTable">
      <thead>
        <tr>
          <th>Item ID</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section">
    <h3>Interaction History</h3>
    <table id="historyTable">
      <thead>
        <tr>
          <th>#</th>
          <th>Item ID</th>
          <th>Action</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const API = "https://alg-backend.onrender.com";
    document.getElementById("apiBase").textContent = API;

    function setStatus(id, message, isError = false) {
      const el = document.getElementById(id);
      el.textContent = message || "";
      el.className = isError ? "error" : "loading";
    }

    function clearTableBody(tableId) {
      document.querySelector(`#${tableId} tbody`).innerHTML = "";
    }

    function addRow(tableId, cells) {
      const tbody = document.querySelector(`#${tableId} tbody`);
      const tr = document.createElement("tr");

      cells.forEach(cell => {
        const td = document.createElement("td");
        td.textContent = cell ?? "";
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    }

    function formatTimestamp(ts) {
      if (!ts) return "";
      const date = new Date(ts * 1000);
      return date.toLocaleString();
    }

    async function loadCurrentUser() {
      setStatus("currentUserStatus", "Loading current active user...");

      clearTableBody("currentUserTable");
      clearTableBody("likedTable");
      clearTableBody("skippedTable");
      clearTableBody("historyTable");

      try {
        const res = await fetch(`${API}/admin/current-user`);
        const data = await res.json();

        if (!data.active_user) {
          setStatus("currentUserStatus", "No active user right now.");
          return;
        }

        addRow("currentUserTable", [
          data.active_user,
          String(data.has_vector),
          data.total_seen,
          data.liked_count,
          data.skipped_count,
          formatTimestamp(data.last_activity_at)
        ]);

        (data.liked || []).forEach(itemId => addRow("likedTable", [itemId]));
        (data.skipped || []).forEach(itemId => addRow("skippedTable", [itemId]));

        (data.history || []).forEach((entry, index) => {
          addRow("historyTable", [
            index + 1,
            entry.item_id,
            entry.action,
            formatTimestamp(entry.ts)
          ]);
        });

        setStatus("currentUserStatus", `Showing live data for ${data.active_user}.`);
      } catch (err) {
        console.error(err);
        setStatus("currentUserStatus", "Failed to load current user data.", true);
      }
    }

    loadCurrentUser();
    setInterval(loadCurrentUser, 2000);
  </script>
</body>
</html>
