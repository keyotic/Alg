<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Alg/assets/index.css" />
    <link rel="stylesheet" href="../src/index.css" />
    <link rel="stylesheet" href="https://use.typekit.net/jha8zkp.css">
    <title>Document</title>
</head>
<body>

    <div class="intro">
        <p class="introtext" id="introText">
            Greetings, I am <span class="Algoracle">ALGORACLE.</span> Your personal algorithm and fortune teller.
            Based on what you like and dislike, I know what you want to see, and can tell your future based on it.
        </p>
    </div>

    <div>
        <button onclick="goNextPage()" class="arrow">
            <img src="assets/img/Arrow.svg" alt="ENTER">
        </button>
    </div>

    <script>
        const synth = window.speechSynthesis;
        let voices = [];
        let hasStarted = false;

        function loadVoices() {
            voices = synth.getVoices();
        }

        function getPreferredVoice() {
            if (!voices.length) return null;

            return (
                voices.find(v => v.name === "Google UK English Female") ||
                voices.find(v => v.name === "Microsoft Sonia Online (Natural) - English (United Kingdom)") ||
                voices.find(v => v.name === "Samantha") ||
                voices.find(v => v.name === "Karen") ||
                voices.find(v => v.name.toLowerCase().includes("female") && v.lang.startsWith("en")) ||
                voices.find(v => v.lang === "en-GB") ||
                voices.find(v => v.lang === "en-US") ||
                voices[0]
            );
        }

        function speakLines(lines, index = 0) {
            if (index >= lines.length) return;

            const text = lines[index];
            const utterance = new SpeechSynthesisUtterance(text);
            const selectedVoice = getPreferredVoice();

            if (selectedVoice) {
                utterance.voice = selectedVoice;
                utterance.lang = selectedVoice.lang;
            } else {
                utterance.lang = "en-GB";
            }

            utterance.rate = 0.78;
            utterance.pitch = 0.82;
            utterance.volume = 1;

            utterance.onend = () => {
                setTimeout(() => speakLines(lines, index + 1), 350);
            };

            synth.speak(utterance);
        }

        function speakIntro() {
            if (!("speechSynthesis" in window)) return;

            synth.cancel();

            const lines = [
                "Greetings...",
                "I am Algoracle.",
                "Your personal algorithm, and fortune teller.",
                "Based on what you like and dislike...",
                "I know what you want to see...",
                "and can tell your future based on it."
            ];

            speakLines(lines);
        }

        function goNextPage() {
            if ("speechSynthesis" in window) {
                synth.cancel();
            }
            window.location.href = "name1.html";
        }

        if ("speechSynthesis" in window) {
            loadVoices();

            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = loadVoices;
            }

            window.addEventListener("load", () => {
                if (hasStarted) return;
                hasStarted = true;

                setTimeout(() => {
                    speakIntro();
                }, 900);
            });

            window.addEventListener("beforeunload", () => {
                synth.cancel();
            });
        }
    </script>
</body>
</html>
