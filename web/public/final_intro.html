<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Alg/assets/index.css">
    <link rel="stylesheet" href="../src/index.css"/>
    <link rel="stylesheet" href="https://use.typekit.net/jha8zkp.css">
    <title>Document</title>
</head>
<body>
   <p class="fintrotext" id="output">
     <span id="username-line"></span><br>Show me who you are… and I will shape what you are about to become.
   </p>


<script>
  const params = new URLSearchParams(window.location.search);
  const username = params.get("name") || "stranger";


  if (params.get("name")) {
    sessionStorage.setItem("user_id", params.get("name"));
  }


  document.getElementById("username-line").textContent =
    `${username}... I see you. A pleasure, though this is only the beginning. Let us begin the calibration, so your pattern may reveal itself.`;
</script>


<div>
  <button onclick="goNextPage()" class="finarrow">
    <img src="assets/img/Arrow.svg" alt="ENTER">
  </button>
</div>


<script>
    const synth = window.speechSynthesis;
    let voices = [];
    let hasStarted = false;
    let speechStopped = false;


    function loadVoices() {
        voices = synth.getVoices();
    }


    function getPreferredVoice() {
        if (!voices.length) return null;


        return (
            voices.find(v => v.name === "Google UK English Female") ||
            voices.find(v => v.name === "Microsoft Sonia Online (Natural) - English (United Kingdom)") ||
            voices.find(v => v.name === "Samantha") ||
            voices.find(v => v.name === "Karen") ||
            voices.find(v => v.name.toLowerCase().includes("female") && v.lang.startsWith("en")) ||
            voices.find(v => v.lang === "en-GB") ||
            voices.find(v => v.lang === "en-US") ||
            voices[0]
        );
    }


    function stopSpeaking() {
        speechStopped = true;
        if ("speechSynthesis" in window) {
            synth.cancel();
        }
    }


    function speakLines(lines, index = 0) {
        if (speechStopped) return;
        if (index >= lines.length) return;


        const utterance = new SpeechSynthesisUtterance(lines[index]);
        const selectedVoice = getPreferredVoice();


        if (selectedVoice) {
            utterance.voice = selectedVoice;
            utterance.lang = selectedVoice.lang;
        } else {
            utterance.lang = "en-GB";
        }


        utterance.rate = 0.78;
        utterance.pitch = 0.82;
        utterance.volume = 1;


        utterance.onend = () => {
            if (speechStopped) return;
            setTimeout(() => speakLines(lines, index + 1), 350);
        };


        synth.speak(utterance);
    }


    function speakIntro() {
        if (!("speechSynthesis" in window)) return;
        if (speechStopped) return;


        synth.cancel();


        const lines = [
            `${username}...`,
            "I see you. A pleasure, though this is only the beginning.",
            "Let us begin the calibration, so your pattern may reveal itself.",
            "Show me who you are… and I will shape what you are about to become."
        ];


        speakLines(lines);
    }


    function goNextPage() {
        stopSpeaking();
        window.location.href = "index.html";
    }


    if ("speechSynthesis" in window) {
        loadVoices();


        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }


        window.addEventListener("load", () => {
            if (hasStarted) return;
            hasStarted = true;


            setTimeout(() => {
                if (!speechStopped) {
                    speakIntro();
                }
            }, 900);
        });


        window.addEventListener("beforeunload", () => {
            stopSpeaking();
        });


        window.addEventListener("pagehide", () => {
            stopSpeaking();
        });
    }
</script>
</body>
</html>
