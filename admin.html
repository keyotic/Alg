<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Algoracle</title>
  <style>
    :root {
      --left-w: 310px;
      --bottom-h: 293px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: mr-eaves-xl-modern, sans-serif;
      line-height: 1.45;
      background: black;
      color: white;
    }

    h1 {
      font-family: cesso;
      font-size: 42pt;
      text-align: center;
    }

    h2, h3 { margin: 0 0 10px; }

    /* ── LEFT PANEL ── fixed, full viewport height */
    #leftPanel {
      position: fixed;
      top: 0;
      left: 0;
      width: 450px;
      height: 100vh;
      border-right: 4px solid #fff;
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
      overflow: hidden;
      z-index: 10;
    }

    .summary {
      width: 100%;
      margin-top: 16px;
      flex-shrink: 0;
    }

    .section {
      margin-top: 24px;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .section h3 {
      flex-shrink: 0;
      margin: 0 0 8px;
    }

    .scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      width: 100%;
    }

    #historyTable {
      width: 100%;
      border-collapse: collapse;
    }

    #historyTable th,
    #historyTable td {
      padding: 8px 10px;
      font-size: 13px;
      border-bottom: 1px solid #222;
      color: white;
    }

    #historyTable th {
      background: #111;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    #footer {
      flex-shrink: 0;
      padding-top: 12px;
      margin-top: 16px;
      border-top: 1px solid #333;
    }

    .toolbar {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #fff;
      background: transparent;
      color: #fff;
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
    }

    button:hover { background: #1a1a1a; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #444;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: bold;
      color: #aaa;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #0f9d58;
      display: inline-block;
    }

    .meta {
      color: #aaa;
      font-size: 12px;
      margin: 2px 0;
    }

    .status {
      font-size: 13px;
      margin-top: 10px;
      color: #aaa;
      flex-shrink: 0;
    }

    .ok    { color: #0f9d58; font-weight: bold; }
    .error { color: #c62828; font-weight: bold; }

    .empty {
      color: #555;
      font-style: italic;
      font-size: 13px;
      padding: 8px 0;
    }

    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid transparent;
    }

    .pill.like { color: #C0FD02; }
    .pill.skip { color: #FB00FF;  }

    /* ── MIDDLE PANEL ──
       fixed, top-right, height = viewport minus bottom panel */
    #feedJourneySection {
      position: fixed;
      top: 0;
      left: 450px;
      right: 0;
      /* explicit pixel height via calc so height:100% on children resolves */
      height: calc(100vh - var(--bottom-h));
      overflow: hidden;
      z-index: 5;
    }

    #feedJourney {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #feedJourney svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: hidden;
    }

    /* ── BOTTOM PANEL ──
       fixed, bottom-right strip */
    #bottomPanel {
      position: fixed;
      left: 450px;
      right: 0;
      bottom: 0;
      height: var(--bottom-h);
      border-top: 4px solid #fff;
      display: flex;
      align-items: center;
      gap: 48px;
      padding: 0 32px;
      z-index: 10;
    }

    .legend {
      flex-shrink: 0;
      padding-left: 100px;
    }

    .legend img {
      display: block;
      width: 667px;
      height: 245px;
      object-fit: contain;
    }

    .fortune {
      flex: 1 1 auto;
      margin-left: 200px;
    }

    .fortune blockquote {
      margin: 0;
      font-style: italic;
      font-size: 24pt;
      max-width: 600px;
      font-family: mr-eaves-xl-modern, sans-serif;
    }
  </style>
</head>

<body>

  <!-- ── LEFT PANEL ── -->
  <div id="leftPanel">
    <h1>Algoracle</h1>

    <div id="currentUserStatus" class="status">Loading current active user...</div>

    <div class="summary">
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px;">

        <div style="display:flex;justify-content:space-between;align-items:baseline;">
          <span style="color:#aaa;font-size:14px;text-transform:uppercase;letter-spacing:0.06em;">Active user</span>
          <span id="summaryUser" style="font-size:16px;font-weight:bold;">&mdash;</span>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:baseline;">
          <span style="color:#aaa;font-size:14px;text-transform:uppercase;letter-spacing:0.06em;">Likes</span>
          <span id="summaryLikes" style="font-size:16px;font-weight:bold;">0</span>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:baseline;">
          <span style="color:#aaa;font-size:14px;text-transform:uppercase;letter-spacing:0.06em;">Skips</span>
          <span id="summarySkips" style="font-size:16px;font-weight:bold;">0</span>
        </div>

      </div>
    </div>

    <div class="section">
      <h3>Interaction History</h3>
      <div class="scroll">
        <table id="historyTable">
          <thead>
            <tr>
              <th style="text-align:left;">Item ID</th>
              <th style="text-align:center;">Title</th>
              <th style="text-align:right;">Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="historyEmpty" class="empty" style="display:none;">No interaction history recorded yet.</div>
    </div>

    <div id="footer">
      <p class="meta">Backend: <span id="apiBase"></span></p>
      <p class="meta">Refresh interval: every 2 seconds</p>
      <p class="meta">Last refresh: <span id="lastRefresh">&mdash;</span></p>
      <div class="toolbar">
        <div class="badge"><span class="dot"></span> Live polling enabled</div>
        <button id="refreshBtn">Refresh now</button>
        <button id="toggleBtn">Pause auto-refresh</button>
      </div>
    </div>
  </div>

  <!-- ── MIDDLE PANEL: data visualization ── -->
  <div id="feedJourneySection">
    <div id="feedJourney"></div>
  </div>

  <!-- ── BOTTOM PANEL: legend + fortune ── -->
  <div id="bottomPanel">
    <div class="legend">
      <img src="assets/img/legend-data.jpg" alt="Legend">
    </div>
    <div class="fortune">
      <blockquote id="fortunePreviewText">No active user right now.</blockquote>
    </div>
  </div>

  <script>
    const API = "https://alg-backend.onrender.com";
    const FEED_CSV_URL = `${API}/admin/feed.csv`;
    const REFRESH_MS = 2000;

    document.getElementById("apiBase").textContent = API;

    let pollingPaused = false;
    let refreshInFlight = false;
    let pollTimer = null;

    function setStatus(message, mode = "loading") {
      const el = document.getElementById("currentUserStatus");
      el.textContent = message || "";
      if (mode === "error") el.className = "status error";
      else if (mode === "ok") el.className = "status ok";
      else el.className = "status";
    }

    function clearTableBody(tableId) {
      document.querySelector(`#${tableId} tbody`).innerHTML = "";
    }

    function addRow(tableId, cells, renderAsCode = false, alignments = []) {
      const tbody = document.querySelector(`#${tableId} tbody`);
      const tr = document.createElement("tr");
      cells.forEach((cell, i) => {
        const td = document.createElement("td");
        if (alignments[i]) td.style.textAlign = alignments[i];
        if (cell instanceof HTMLElement) {
          td.appendChild(cell);
        } else if (renderAsCode && typeof cell === "string") {
          const code = document.createElement("code");
          code.textContent = cell;
          td.appendChild(code);
        } else {
          td.textContent = cell ?? "";
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    }

    function setEmptyState(id, visible) {
      document.getElementById(id).style.display = visible ? "block" : "none";
    }

    function setSummary(data) {
      document.getElementById("summaryUser").textContent = data?.active_user || "\u2014";
      document.getElementById("summaryLikes").textContent = data?.liked_count ?? 0;
      document.getElementById("summarySkips").textContent = data?.skipped_count ?? 0;
    }

    function resetSummary() {
      setSummary({ active_user: null, liked_count: 0, skipped_count: 0 });
    }

    function setFortunePreview(data) {
      const hasUser = Boolean(data?.active_user);
      document.getElementById("fortunePreviewText").textContent =
        hasUser ? (data?.fortune_preview || "No preview fortune available.") : "No active user right now.";
    }

    function resetFortunePreview() {
      setFortunePreview({ active_user: null, fortune_preview: null });
    }

    function updateLastRefresh() {
      document.getElementById("lastRefresh").textContent = new Date().toLocaleTimeString();
    }

    async function fetchJson(url) {
      const res = await fetch(url, { cache: "no-store" });
      let body = null;
      const contentType = res.headers.get("content-type") || "";
      if (contentType.includes("application/json")) body = await res.json();
      else body = await res.text();

      if (!res.ok) {
        const detail =
          typeof body === "object" && body !== null
            ? (body.detail || JSON.stringify(body))
            : String(body || res.statusText || "Request failed");
        throw new Error(`HTTP ${res.status}: ${detail}`);
      }

      return body;
    }

    function clearAllTables() {
      clearTableBody("historyTable");
    }

    function renderCurrentUser(data) {
      clearAllTables();
      setEmptyState("historyEmpty", false);

      if (!data.active_user) {
        resetSummary();
        resetFortunePreview();
        setEmptyState("historyEmpty", true);
        setStatus("No active user right now.");
        return;
      }

      setSummary(data);
      setFortunePreview(data);

      if ((data.history || []).length) {
        data.history.forEach((entry) => {
          const actionPill = document.createElement("span");
          actionPill.className = `pill ${entry.action === "like" ? "like" : "skip"}`;
          actionPill.textContent = entry.action;
          addRow("historyTable", [entry.item_id, entry.title || "\u2014", actionPill], false, ["left", "center", "right"]);
        });
      } else {
        setEmptyState("historyEmpty", true);
      }

      setStatus(`Showing live data for ${data.active_user}.`, "ok");
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (!lines.length) return [];

      const headers = lines[0].split(",").map(h => h.trim());

      return lines.slice(1).map(line => {
        const values = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || [];
        const row = {};

        headers.forEach((header, i) => {
          let value = values[i] ?? "";
          value = value.trim().replace(/^"|"$/g, "");
          row[header] = value;
        });

        return row;
      });
    }

    function getNumericId(itemId) {
      const match = String(itemId ?? "").match(/\d+/);
      return match ? Number(match[0]) : 0;
    }

    function seededNoise(n) {
      const x = Math.sin(n * 999.123) * 10000;
      return x - Math.floor(x);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function addDashedLine(lines, x1, y1, x2, y2, status) {
      const dashLength = 14;
      const gapLength = 10;
      const dx = x2 - x1;
      const dy = y2 - y1;
      const distance = Math.sqrt(dx * dx + dy * dy);
      if (distance === 0) return;

      const ux = dx / distance;
      const uy = dy / distance;
      let current = 0;

      while (current < distance) {
        const start = current;
        const end = Math.min(current + dashLength, distance);

        lines.push({
          x1: x1 + ux * start,
          y1: y1 + uy * start,
          x2: x1 + ux * end,
          y2: y1 + uy * end,
          status,
          lineType: "pending",
        });

        current += dashLength + gapLength;
      }
    }

    function radiusFromSize(size) {
      return Math.sqrt(size / Math.PI) * 0.75;
    }

    function labelSizeFromVisualSize(size, maxSize = 28) {
      return Math.max(11, Math.min(maxSize, Math.sqrt(size) / 3.6));
    }

    function resolveCollisions(nodes, margin, width, height) {
      for (let step = 0; step < 90; step++) {
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const a = nodes[i];
            const b = nodes[j];

            const ar = radiusFromSize(a.visualSize || 1600) + margin;
            const br = radiusFromSize(b.visualSize || 1600) + margin;

            let dx = b.x - a.x;
            let dy = b.y - a.y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist === 0) {
              dx = seededNoise(i + 1) - 0.5;
              dy = seededNoise(j + 1) - 0.5;
              dist = Math.sqrt(dx * dx + dy * dy);
            }

            const minDist = ar + br;

            if (dist < minDist) {
              const push = (minDist - dist) / 2;
              const ux = dx / dist;
              const uy = dy / dist;

              a.x -= ux * push;
              a.y -= uy * push;
              b.x += ux * push;
              b.y += uy * push;
            }
          }
        }

        nodes.forEach((d) => {
          const r = radiusFromSize(d.visualSize || 1600) + 24;
          d.x = clamp(d.x, r, width - r);
          d.y = clamp(d.y, r, height - r);
        });
      }
    }

    function buildFeedNodes(rows) {
      return rows.map(row => {
        const id = getNumericId(row.item_id);
        return {
          id,
          label: String(id),
          position: Number(row.position),
          status: String(row.status || "").trim().toLowerCase(),
          title: row.title || "",
        };
      });
    }

    function renderFeedJourneyFromRows(rows) {
      const container = document.getElementById("feedJourney");
      const width = 1600;
      const height = 900;

      const nodes = buildFeedNodes(rows);

      const interacted = nodes
        .filter(d => d.status === "liked" || d.status === "skipped")
        .sort((a, b) => a.position - b.position);

      const activeNode = nodes.find(d => d.status === "active");

      const pending = nodes
        .filter(d => d.status === "pending")
        .sort((a, b) => a.position - b.position);

      const pathNodes = [...interacted];
      if (activeNode) pathNodes.push(activeNode);

      const lines = [];
      const rings = [];

      const startX = 170;
      const endX = 1120;
      const centerY = 440;

      const count = Math.max(pathNodes.length, 1);
      const spacing = count > 1 ? (endX - startX) / (count - 1) : 0;

      pathNodes.forEach((d, i) => {
        const id = Number(d.id);

        const scatterX =
          Math.sin(id * 0.37 + i * 0.8) * 35 +
          (seededNoise(id + 10) - 0.5) * 30;

        const scatterY =
          Math.sin(id * 0.29 + i * 1.15) * 80 +
          Math.cos(id * 0.17 + i * 0.7) * 45 +
          (seededNoise(id + 20) - 0.5) * 40;

        d.x = startX + i * spacing + scatterX;
        d.y = centerY + scatterY;

        d.x = clamp(d.x, 110, 1250);
        d.y = clamp(d.y, 115, 785);

        d.visualSize =
          d.status === "active"
            ? 6600
            : d.status === "liked"
              ? 5000 + seededNoise(id + 12) * 650
              : 1500 + seededNoise(id + 18) * 350;

        if (Number(d.position) === 20) {
          d.visualSize = 7600;
        }

        d.labelSize = labelSizeFromVisualSize(d.visualSize, 28);
      });

      if (activeNode) {
        const fan = [
          { x: 290, y: -250 },
          { x: 430, y: -110 },
          { x: 470, y: 70 },
          { x: 350, y: 220 },
          { x: 150, y: 310 },
          { x: -80, y: 290 },
          { x: -220, y: 140 },
          { x: -210, y: -60 },
          { x: -60, y: -230 },
          { x: 150, y: -320 },
        ];

        pending.forEach((d, i) => {
          const id = Number(d.id);
          const p = fan[i % fan.length];

          d.x = activeNode.x + p.x + (seededNoise(id + 10) - 0.5) * 45;
          d.y = activeNode.y + p.y + (seededNoise(id + 20) - 0.5) * 45;

          d.x = clamp(d.x, 90, 1510);
          d.y = clamp(d.y, 80, 820);

          d.visualSize = 1150 + seededNoise(id + 77) * 850;

          if (Number(d.position) > 20) {
            d.visualSize *= 0.65;
          }

          d.labelSize = labelSizeFromVisualSize(d.visualSize, 22);
        });
      }

      resolveCollisions(nodes, 22, width, height);

      pathNodes.forEach((d, i) => {
        if (d.status === "active") {
          rings.push({ x: d.x, y: d.y, size: d.visualSize * 1.65 });
        }

        if (i > 0) {
          const prev = pathNodes[i - 1];
          lines.push({
            x1: prev.x, y1: prev.y,
            x2: d.x, y2: d.y,
            status: d.status,
            lineType: "history",
          });
        }
      });

      if (activeNode) {
        pending.forEach((d) => {
          addDashedLine(lines, activeNode.x, activeNode.y, d.x, d.y, "pending");
        });
      }

      const svgParts = [];
      svgParts.push(`<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Feed Journey Visualization">`);

      lines.forEach(line => {
        const color = line.status === "liked" ? "#B6FF00" : line.status === "skipped" ? "#FF00FF" : "#FFFFFF";
        const strokeWidth = line.lineType === "pending" ? 2 : line.status === "liked" ? 4 : 3.5;
        const opacity = line.lineType === "pending" ? 0.35 : 0.9;
        svgParts.push(`<line x1="${line.x1}" y1="${line.y1}" x2="${line.x2}" y2="${line.y2}" stroke="${color}" stroke-width="${strokeWidth}" opacity="${opacity}" stroke-linecap="round"/>`);
      });

      rings.forEach(ring => {
        const r = radiusFromSize(ring.size);
        svgParts.push(`<circle cx="${ring.x}" cy="${ring.y}" r="${r}" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.36"/>`);
      });

      nodes.forEach(d => {
        const r = radiusFromSize(d.visualSize);
        const stroke = d.status === "liked" ? "#B6FF00" : d.status === "skipped" ? "#FF00FF" : "#FFFFFF";
        const opacity = Number(d.position) > 20 ? 0.45 : d.status === "pending" ? 0.86 : 1;
        const strokeWidth = d.status === "active" ? 6 : d.status === "liked" ? 5 : 4;
        svgParts.push(`<circle cx="${d.x}" cy="${d.y}" r="${r}" fill="black" stroke="${stroke}" stroke-width="${strokeWidth}" opacity="${opacity}"/>`);
      });

      nodes.forEach(d => {
        const opacity = Number(d.position) > 20 ? 0.45 : 1;
        svgParts.push(`<text x="${d.x}" y="${d.y}" fill="#FFFFFF" opacity="${opacity}" font-size="${d.labelSize}" font-weight="bold" text-anchor="middle" dominant-baseline="middle" font-family="mr-eaves-xl-modern, sans-serif">${d.label}</text>`);
      });

      svgParts.push(`</svg>`);
      container.innerHTML = svgParts.join("");
    }

    async function loadFeedJourney() {
      try {
        const res = await fetch(FEED_CSV_URL, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const csv = await res.text();
        const rows = parseCSV(csv);
        renderFeedJourneyFromRows(rows);
      } catch (err) {
        console.error("Failed to load feed journey:", err);
        document.getElementById("feedJourney").innerHTML =
          `<p class="meta">Failed to load feed visualization.</p>`;
      }
    }

    async function loadCurrentUser() {
      if (refreshInFlight) return;
      refreshInFlight = true;
      setStatus("Loading current active user...");

      try {
        const data = await fetchJson(`${API}/admin/current-user`);
        renderCurrentUser(data);
        await loadFeedJourney();
        updateLastRefresh();
      } catch (err) {
        console.error(err);
        clearAllTables();
        resetSummary();
        resetFortunePreview();
        setEmptyState("historyEmpty", true);
        setStatus(`Failed to load current user data: ${err.message}`, "error");
      } finally {
        refreshInFlight = false;
      }
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(() => {
        if (!pollingPaused) loadCurrentUser();
      }, REFRESH_MS);
    }

    document.getElementById("refreshBtn").addEventListener("click", () => { loadCurrentUser(); });

    document.getElementById("toggleBtn").addEventListener("click", (e) => {
      pollingPaused = !pollingPaused;
      e.currentTarget.textContent = pollingPaused ? "Resume auto-refresh" : "Pause auto-refresh";
      setStatus(
        pollingPaused ? "Auto-refresh paused." : "Auto-refresh resumed.",
        pollingPaused ? "" : "ok"
      );
    });

    loadCurrentUser();
    startPolling();
  </script>
</body>
</html>
