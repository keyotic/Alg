<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Algoracle</title>
    <link rel="stylesheet" href="/Alg/assets/index.css" />
    <link rel="stylesheet" href="../src/index.css" />
    <link rel="stylesheet" href="https://use.typekit.net/jha8zkp.css">
</head>
<body class="body">
    <div>
        <h1>Algoracle</h1>
    </div>
    <div>
        <button onclick="handleEnter()" class="enter">ENTER</button>
    </div>

    <script>
        const API =
            window.location.hostname === "localhost"
                ? "http://localhost:8000"
                : "https://alg-backend.onrender.com";

        async function handleEnter() {
            const userId = sessionStorage.getItem("user_id");

            if (userId) {
                try {
                    await fetch(`${API}/reset`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ user_id: userId })
                    });
                } catch (err) {
                    console.error("Reset failed:", err);
                }

                sessionStorage.removeItem("user_id");
            }

            window.location.href = "Intro.html";
        }
    </script>
</body>
</html>
