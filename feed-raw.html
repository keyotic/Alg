<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>feed.csv</title>
  <style>
    body { font-family: monospace; font-size: 13px; background: #fff; color: #000; padding: 10px; margin: 0; }
    pre { white-space: pre; margin: 0; }
    button { font-family: monospace; font-size: 13px; margin-bottom: 8px; cursor: pointer; padding: 3px 10px; }
    #meta { margin-bottom: 6px; }
  </style>
</head>
<body>

<div id="meta">user=— | seen=0 | likes=0 | skips=0 | refreshed=—</div>
<button onclick="downloadCSV()">⬇ Download .csv</button>
<pre id="csv">Loading…</pre>

<script>
  const API = "https://alg-backend.onrender.com";
  let lastItems = [];

  function toCSV(items) {
    const header = "#,status,item_id,title";
    const rows = items.map(item =>
      [
        item.position ?? "",
        item.is_active ? "ACTIVE" : "next " + ((item.position ?? 1) - 1),
        '"' + (item.item_id || "").replace(/"/g, '""') + '"',
        '"' + (item.title   || "").replace(/"/g, '""') + '"'
      ].join(",")
    );
    return [header, ...rows].join("\n");
  }

  async function load() {
    try {
      const res = await fetch(API + "/admin/current-user", { cache: "no-store" });
      const data = await res.json();

      document.getElementById("meta").textContent =
        "user=" + (data.active_user || "—") +
        " | seen=" + (data.total_seen ?? 0) +
        " | likes=" + (data.liked_count ?? 0) +
        " | skips=" + (data.skipped_count ?? 0) +
        " | refreshed=" + new Date().toLocaleTimeString();

      lastItems = data.current_feed || [];
      document.getElementById("csv").textContent =
        lastItems.length ? toCSV(lastItems) : "No items in queue.";
    } catch (e) {
      document.getElementById("csv").textContent = "Error: " + e.message;
    }
  }

  function downloadCSV() {
    if (!lastItems.length) return;
    const blob = new Blob([toCSV(lastItems)], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "current-feed.csv";
    a.click();
  }

  setInterval(load, 2000);
  load();
</script>
</body>
</html>
