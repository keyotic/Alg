<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="/Alg/assets/index.css" />
    <link rel="stylesheet" href="../src/index.css" />
    <link rel="stylesheet" href="https://use.typekit.net/jha8zkp.css">
    <title>Document</title>
</head>
<body>

    <div class="intro">
        <p class="introtext2" id="introText">
            From what you love… and what you reject… <br>I learn.
            In those patterns, your future begins to take shape. Tell me what draws you in, and I will not only show you what you wish to see…<br> I will reveal what awaits you next.
        </p>
    </div>

    <div>
        <button onclick="goNextPage()" class="arrow">
            <img src="assets/img/Arrow.svg" alt="ENTER">
        </button>
    </div>

    <script>
        const synth = window.speechSynthesis;
        let voices = [];
        let hasStarted = false;
        let speechStopped = false;

        function loadVoices() {
            voices = synth.getVoices();
        }

        function getPreferredVoice() {
            if (!voices.length) return null;

            return (
                voices.find(v => v.name === "Google UK English Female") ||
                voices.find(v => v.name === "Microsoft Sonia Online (Natural) - English (United Kingdom)") ||
                voices.find(v => v.name === "Samantha") ||
                voices.find(v => v.name === "Kate") ||
                voices.find(v => v.name.toLowerCase().includes("female") && v.lang.startsWith("en")) ||
                voices.find(v => v.lang === "en-GB") ||
                voices.find(v => v.lang === "en-US") ||
                voices[0]
            );
        }

        function stopSpeaking() {
            speechStopped = true;
            if ("speechSynthesis" in window) {
                synth.cancel();
            }
        }

        function speakLines(lines, index = 0) {
            if (speechStopped) return;
            if (index >= lines.length) return;

            const text = lines[index];
            const utterance = new SpeechSynthesisUtterance(text);
            const selectedVoice = getPreferredVoice();

            if (selectedVoice) {
                utterance.voice = selectedVoice;
                utterance.lang = selectedVoice.lang;
            } else {
                utterance.lang = "en-GB";
            }

            utterance.rate = 0.78;
            utterance.pitch = 0.82;
            utterance.volume = 1;

            utterance.onend = () => {
                if (speechStopped) return;
                setTimeout(() => speakLines(lines, index + 1), 350);
            };

            synth.speak(utterance);
        }

        function speakIntro() {
            if (!("speechSynthesis" in window)) return;
            if (speechStopped) return;

            synth.cancel();

            const lines = [
                "From what you love… and what you reject… I learn.",
                "In those patterns, your future begins to take shape.",
                "Tell me what draws you in, and I will not only show you what you wish to see… I will reveal what awaits you next."
            ];

            speakLines(lines);
        }

        function goNextPage() {
            stopSpeaking();
            window.location.href = "name1.html";
        }

        if ("speechSynthesis" in window) {
            loadVoices();

            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = loadVoices;
            }

            window.addEventListener("load", () => {
                if (hasStarted) return;
                hasStarted = true;

                setTimeout(() => {
                    if (!speechStopped) {
                        speakIntro();
                    }
                }, 900);
            });

            window.addEventListener("beforeunload", () => {
                stopSpeaking();
            });

            window.addEventListener("pagehide", () => {
                stopSpeaking();
            });
        }
    </script>
</body>
</html>
